name: decode-b64-assets
on:
  push:
    paths: ['decode.trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 files into binaries
        run: |
          shopt -s globstar nullglob
          for f in b64/**/*.b64; do
            out="${f#b64/}"; out="${out%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            git rm -q "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Decode media assets"
          git push
